api:
  base_url: "https://api.open-meteo.com/v1/forecast"
  timeout_seconds: 30

  # Retrieve the previous 2 days plus today/forecast.
  past_days: 2
  forecast_days: 1

  timezone: "Europe/London"

  hourly_fields:
    - temperature_2m
    - relative_humidity_2m
    - precipitation
    - wind_speed_10m
    - weather_code


cities:
  - id: london
    name: London
    latitude: 51.5074
    longitude: -0.1278

  - id: brighton
    name: Brighton
    latitude: 50.8225
    longitude: -0.1372

  - id: manchester
    name: Manchester
    latitude: 53.4808
    longitude: -2.2426

  - id: birmingham
    name: Birmingham
    latitude: 52.4862
    longitude: -1.8904

  - id: edinburgh
    name: Edinburgh
    latitude: 55.9533
    longitude: -3.1883


paths:
  raw: data/raw
  clean: data/clean
  transform: data/transform
  logs: logs


alerts:
  extreme_hot_c: 30.0
  extreme_cold_c: -5.0
  heavy_rain_mm: 10.0
  high_wind_kmh: 60.0