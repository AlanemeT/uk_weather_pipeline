[build-system]

requires = [
    "setuptools>=69",
    "wheel"
]

build-backend = "setuptools.build_meta"


[project]

name = "uk-weather-pipeline"

version = "0.1.0"

description = "Incremental UK hourly weather data pipeline using Open-Meteo"

requires-python = ">=3.11"


[tool.setuptools]

package-dir = {"" = "src"}


[tool.setuptools.packages.find]

where = ["src"]